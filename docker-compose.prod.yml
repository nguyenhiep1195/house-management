# Production stack for a single, small EC2 instance.
#
#   All three containers run on one box:
#     mysql  — database (data persisted in a named volume, NOT exposed to the internet)
#     api    — NestJS backend (only reachable through caddy, no host port)
#     caddy  — reverse proxy that terminates HTTPS (auto Let's Encrypt cert)
#
# The Next.js frontend is hosted separately on Vercel and calls this API over
# https://api.<your-domain>.
#
# Run with (from the repo root, on the server):
#   docker compose --env-file deploy/.env.prod -f docker-compose.prod.yml up -d --build
#
# `--env-file deploy/.env.prod` feeds ${VAR} interpolation below AND the values
# are injected into the api container via env_file.

services:
  mysql:
    image: mysql:8
    container_name: hm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    # No `ports:` on purpose — MySQL must never be reachable from the internet.
    # Only the api container (same compose network) can connect to it.
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    container_name: hm-api
    # App secrets (JWT_SECRET, SMTP creds, SEED_ADMIN_*) come from this file.
    env_file:
      - ./deploy/.env.prod
    environment:
      # Single source of truth for the DB password: built from the same var
      # MySQL uses above, so they can never drift apart.
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}"
      PORT: "3001"
    # No host port — the API is only reached through caddy.
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: hm-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # stores the TLS certificates — keep this volume!
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
